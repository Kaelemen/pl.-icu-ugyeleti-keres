name: Havi kérés-archiválás és nullázás

"on":
  schedule:
    # minden nap 22:00 UTC-kor lefut, de a script maga eldönti, hogy ma a hónap
    # utolsó napja-e - csak akkor csinál bármit is
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_test:
        description: 'Kényszerített teszt-futtatás (a dátum-ellenőrzés megkerülésével)'
        required: false
        default: 'false'
        type: boolean
      force_ev:
        description: 'Teszthez: melyik évet archiválja (csak force_test esetén számít)'
        required: false
        type: string
      force_honap:
        description: 'Teszthez: melyik hónapot archiválja (csak force_test esetén számít)'
        required: false
        type: string
      dry_run:
        description: 'Próbafuttatás - archivál, de nem töröl semmit a Firestore-ból'
        required: false
        default: true
        type: boolean

jobs:
  archive_and_reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install openpyxl requests

      - name: Archiválás és nullázás (csak ha ma a hónap utolsó napja)
        working-directory: planner
        env:
          FORCE_TEST: ${{ github.event.inputs.force_test == 'true' && '1' || '0' }}
          FORCE_EV: ${{ github.event.inputs.force_ev }}
          FORCE_HONAP: ${{ github.event.inputs.force_honap }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false') && '1' || '0' }}
        run: python3 archivalas_es_nullazas.py

      - name: Archívum commitolása a repóba
        run: |
          git config user.name "Deploy Bot"
          git config user.email "deploy@example.com"
          git add planner/archivum/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Havi archívum: $(date +%Y-%m)"
            git push
          else
            echo "Nincs új archívum-fájl, nincs mit commitolni."
          fi
