name: Beosztás generálása

"on":
  workflow_dispatch:
    inputs:
      kivansagok_json:
        description: 'Kívánságok JSON tartalma (illeszd be ide, ha nincs még fájlként a repóban - ha üresen hagyod, a lenti fájlnevet használja)'
        required: false
        type: string
      kivansagok_fajl:
        description: 'Kívánságok fájl neve a repóban (csak akkor számít, ha a fenti mező üres)'
        required: false
        default: 'kivansagok_2026_08.json'
        type: string
      valtozatok:
        description: 'Hány változatot generáljon'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '4'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install -r planner/requirements.txt

      - name: Kívánságok fájl előkészítése
        working-directory: planner
        env:
          KIV_JSON_TARTALOM: ${{ github.event.inputs.kivansagok_json }}
        run: |
          if [ -n "$KIV_JSON_TARTALOM" ]; then
            printf '%s' "$KIV_JSON_TARTALOM" > kivansagok_input.json
            echo "KIV_FAJL=kivansagok_input.json" >> $GITHUB_ENV
          else
            echo "KIV_FAJL=${{ github.event.inputs.kivansagok_fajl }}" >> $GITHUB_ENV
          fi

      - name: DEBUG - diagnosztika a repóba
        working-directory: planner
        run: |
          {
            echo "kivansagok_json input hossza: ${#GITHUB_EVENT_KIV}"
            echo "--- KIV_FAJL: $KIV_FAJL ---"
            if [ -f kivansagok_input.json ]; then
              echo "kivansagok_input.json LÉTEZIK, mérete:"
              wc -c kivansagok_input.json
              echo "--- tartalom eleje ---"
              head -c 500 kivansagok_input.json
              echo ""
              echo "--- ev/honap kiolvasva ---"
              python3 -c "import json; d=json.load(open('kivansagok_input.json',encoding='utf-8')); print('ev:',d.get('ev'),'honap:',d.get('honap'))" || echo "JSON PARSE HIBA"
            else
              echo "kivansagok_input.json NEM létezik - a fallback fájlt fogja használni: $KIV_FAJL"
            fi
          } > debug_utolso_futas.txt
          cat debug_utolso_futas.txt
        env:
          GITHUB_EVENT_KIV: ${{ github.event.inputs.kivansagok_json }}

      - name: Sablon felépítése
        working-directory: planner
        run: python3 build.py

      - name: Beosztás generálása (1 változat)
        if: ${{ github.event.inputs.valtozatok == '1' }}
        working-directory: planner
        run: python3 generate_schedule.py "$KIV_FAJL" ICU_ugyeleti_beosztas.xlsx ICU_ugyeleti_beosztas_kimenet.xlsx

      - name: Beosztás generálása (4 változat)
        if: ${{ github.event.inputs.valtozatok == '4' }}
        working-directory: planner
        run: python3 generate_4_variants.py "$KIV_FAJL" ICU_ugyeleti_beosztas.xlsx ICU_ugyeleti_beosztas_kimenet

      - name: LibreOffice telepítése (a képletek újraszámolásához)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Képletek újraszámolása
        working-directory: planner
        run: |
          for f in ICU_ugyeleti_beosztas_kimenet*.xlsx; do
            soffice --headless --convert-to xlsx --outdir recalced "$f"
            cp "recalced/$f" "$f"
          done

      - name: Csak a nyomtatható lap kigyűjtése, egy közös fájlba
        working-directory: planner
        run: |
          shopt -s nullglob
          variansok=(ICU_ugyeleti_beosztas_kimenet_valtozat*.xlsx)
          if [ ${#variansok[@]} -gt 0 ]; then
            python3 osszevont_nyomtathato.py ICU_beosztas_nyomtathato.xlsx "${variansok[@]}"
          else
            python3 osszevont_nyomtathato.py ICU_beosztas_nyomtathato.xlsx ICU_ugyeleti_beosztas_kimenet.xlsx
          fi

      - name: Eredmény feltöltése letölthetőként
        uses: actions/upload-artifact@v4
        with:
          name: icu-beosztas-eredmeny
          path: |
            planner/ICU_beosztas_nyomtathato.xlsx
          retention-days: 30

      - name: DEBUG fájl commitolása
        run: |
          git config user.name "Deploy Bot"
          git config user.email "deploy@example.com"
          cp planner/debug_utolso_futas.txt planner/ 2>/dev/null || true
          git add planner/debug_utolso_futas.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Debug: utolsó futás diagnosztikája"
            git push
          fi
